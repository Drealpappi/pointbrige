<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointBridge — Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(at 0% 100%, rgba(37, 99, 235, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-100 font-sans antialiased selection:bg-emerald-500/30">
    <nav class="w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
        <div class="text-xl font-black tracking-widest bg-gradient-to-r from-blue-500 to-emerald-400 bg-clip-text text-transparent">
            POINTBRIDGE
        </div>
        <a href="/api/account/login/" class="text-sm font-medium text-gray-400 hover:text-white transition-colors">
            Sign In &rarr;
        </a>
    </nav>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-md p-8 rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl shadow-2xl">
            <div class="mb-8">
                <h1 class="text-2xl font-bold tracking-tight">Forgot your password?</h1>
                <p class="text-sm text-gray-400 mt-2">
                    Enter your email address and we’ll send you a link to create a new password.
                </p>
            </div>

            <form id="forgot-password-form" method="POST" action="/api/account/forgot_password/" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-xs font-semibold tracking-wider text-gray-400 uppercase mb-2">Email Address</label>
                    <input type="email"
                           id="email"
                           name="email"
                           autocomplete="email"
                           placeholder="you@example.com"
                           class="w-full px-4 py-3 bg-black/40 border border-white/10 rounded-xl text-gray-100 placeholder-gray-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all text-sm"
                           required>
                </div>

                <button type="submit"
                        id="submit-btn"
                        class="w-full py-3.5 bg-gradient-to-r from-emerald-500 to-blue-600 hover:from-emerald-600 hover:to-blue-700 text-white text-sm font-semibold rounded-xl transition-all shadow-lg shadow-emerald-500/10 active:scale-[0.99]">
                    Send Reset Link
                </button>
            </form>

            <div id="status-message" role="status" class="mt-4 text-center text-xs font-medium hidden"></div>

            <div class="mt-6 pt-6 border-t border-white/5 text-center text-xs text-gray-400">
                Remember your password?
                <a href="/api/account/login/" class="font-semibold text-emerald-400 hover:underline transition-all ml-1">Sign in</a>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-6 text-[11px] text-gray-600 tracking-wider border-t border-white/5 bg-black/10">
        &copy; 2026 PointBridge Platform. Secured with cryptographic mechanics.
    </footer>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('forgot-password-form');
        const submitButton = document.getElementById('submit-btn');
        const statusMessage = document.getElementById('status-message');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            submitButton.disabled = true;
            submitButton.innerText = 'Sending...';
            statusMessage.className = 'mt-4 text-center text-xs font-medium hidden';

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                    },
                    body: JSON.stringify({
                        email: document.getElementById('email').value
                    })
                });
                const result = await response.json();

                statusMessage.className = response.ok
                    ? 'mt-4 text-center text-xs font-medium text-emerald-400 block'
                    : 'mt-4 text-center text-xs font-medium text-red-400 block';
                statusMessage.innerText = result.message || 'Unable to process your request.';
            } catch (error) {
                statusMessage.className = 'mt-4 text-center text-xs font-medium text-red-400 block';
                statusMessage.innerText = 'Network connection failed. Please try again.';
            } finally {
                submitButton.disabled = false;
                submitButton.innerText = 'Send Reset Link';
            }
        });
    });
    </script>
</body>
</html>
